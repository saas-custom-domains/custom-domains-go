{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}}</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; color: #18181b; }
  section { border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1.25rem; margin-top: 2rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: .75rem; align-items: center; margin: .5rem 0; }
  form { margin: 0; }
  input { padding: .4rem .6rem; border: 1px solid #d4d4d8; border-radius: .4rem; }
  button { padding: .4rem .8rem; border: 0; border-radius: .4rem; background: #18181b; color: white; cursor: pointer; }
  li button { background: none; color: inherit; text-decoration: underline; padding: 0; }
  label { display: block; margin-top: .75rem; font-size: .875rem; }
  .mono { font-family: ui-monospace, monospace; }
  .badge { border-radius: .25rem; padding: 0 .5rem; background: #fef3c7; font-size: .875rem; }
  .badge.active { background: #dcfce7; }
  .push { margin-left: auto; }
  .muted { color: #71717a; font-size: .875rem; }
  [role=alert] { color: #b91c1c; }
  [role=status] { color: #15803d; }
</style>
</head>
<body>
{{end}}
